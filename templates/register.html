{% extends 'base.html' %}
{% load static %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <img src="{% static 'images/logo.png' %}" class="auth-logo">

                        <h2>Create Account 🚀</h2>

                        <p>Join Family Drama and connect with your loved ones.</p>

                    </div>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                placeholder="Enter your username"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Enter your password"
                                required>

                        </div>

                        <button type="submit" class="auth-btn">
                            Create Account
                        </button>

                    </form>

                    <hr>

                    <p class="text-center mt-3 mb-0">

                        Already have an account?

                        <a href="{% url 'login' %}" class="auth-link">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
