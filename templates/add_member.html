{% extends 'base.html' %}

{% block title %}
Add Family Member
{% endblock %}


{% block content %}


<div class="container mt-5">


    <div class="card p-5">


        <h2 class="mb-4">
            Add Family Member
        </h2>



        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}



            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>


                <input 
                type="text"
                name="name"
                class="form-control"
                placeholder="Enter name"
                required>

            </div>




            <div class="mb-3">

                <label class="form-label">
                    Relation
                </label>


                <input 
                type="text"
                name="relation"
                class="form-control"
                placeholder="Father, Mother, Brother..."
                required>

            </div>




            <div class="mb-3">

                <label class="form-label">
                    Profile Image
                </label>


                <input 
                type="file"
                name="image"
                class="form-control">

            </div>




            <button class="btn btn-pink">

                Save Member

            </button>



        </form>


    </div>


</div>


{% endblock %}
